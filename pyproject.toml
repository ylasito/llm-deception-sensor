[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-deception-sensor"
version = "0.5.0"
description = "Local-first LLM/MCP deception and agent behavior intelligence and controlled research sensor"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Open-source research contributors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
agent = ["openai>=1,<3"]

[project.scripts]
llm-deception-sensor = "deceptionsensor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
